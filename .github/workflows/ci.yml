# The three gates (ruff, mypy, pytest), on the estate-faithful platform.
# windows-latest is deliberate: the test suite probes Windows PowerShell 5.1
# behaviour, which a Linux runner cannot exercise. Tool versions and scopes
# come from pyproject.toml ([tool.ruff], [tool.mypy], [tool.pytest.ini-options]).
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest
