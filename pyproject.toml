[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-console-driver"
version = "0.0.1"
description = "Transactionally verified actuation for legacy Windows console surfaces"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Windows console driver contributors" }]
dependencies = []

[project.optional-dependencies]
# Upper bounds are deliberate, matching the windows-evidence-lab convention.
dev = [
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.package-data]
wcd = ["py.typed"]
gpo_observers = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["wcd", "gpo_observers"]
