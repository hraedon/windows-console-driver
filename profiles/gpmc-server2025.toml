# Driver profile: gpmc-server2025
#
# Status: STRUCTURALLY TYPED, ESTATE-OBSERVED FOR THE EXERCISED FLOWS. R2-R5
# records cover the named Server 2025 dialogs and actions used by the shipped
# capabilities. Display-name selectors remain strongly bound to UI language;
# unexercised paths, different builds, and exact per-dialog durability timing
# remain qualification work rather than inferred portability.

[profile]
surface = "gpmc-server2025"
description = "GPMC / GPME (gpmc.msc, group policy editor snap-ins)"
os_family = "Windows Server 2025"
os_build_family = "26100"
# Historical conservative default. Individual capabilities declare their own
# first potentially-mutating boundary when it occurs earlier.
first_commit_point = "ok_startup_scripts_dialog"

# Action classifications (contract section 6). The commit-boundary facts are
# initial facts from the manual regime, to be validated by the spike.

[actions.open_gpo_editor]
class = "orientation_only"
notes = "launches/attaches the editor window (pre-elevated at the setup boundary)"

[actions.navigate_tree]
class = "orientation_only"
notes = "scope-pane navigation; reads surface state only"

[actions.open_startup_scripts_dialog]
class = "orientation_only"
notes = "opens the Scripts (Startup/Shutdown) property sheet"

[actions.add_script_entry]
class = "reversible_pre_commit"
notes = "child dialog; cancel undoes; R2 confirms the end-to-end effect, while exact child-OK durability before the parent OK remains unisolated"

[actions.set_ps_order]
class = "reversible_pre_commit"
notes = "PowerShell-order dropdown selection; R2 ps-order qualifies the visible selection and wire effect, while persistence before parent OK remains unisolated"

[actions.ok_startup_scripts_dialog]
class = "commit_point"
notes = "R2 correlates parent dialog OK with the certified scripts.ini/psscripts.ini result; earlier child boundaries remain conservatively potentially_mutating"

[actions.cancel_dialog]
class = "reversible_pre_commit"
notes = "closes without commit"

# Actions added 2026-09-03 for the R3/R4/R5 capability set. Their end-to-end
# effects are estate-qualified; conservative potentially_mutating classes stay
# in place where a run did not isolate the exact per-dialog durability edge.

[actions.open_property_dialog]
class = "reversible_pre_commit"
notes = "opens a property sheet or child dialog (double-click / Properties / Add); cancel before a commit point undoes it"

[actions.interact_dialog_control]
class = "reversible_pre_commit"
notes = "typing, tabbing, radio/dropdown selection inside a dialog before its OK; in-memory/surface state only"

[actions.ok_child_dialog]
class = "potentially_mutating"
notes = "OK inside a child dialog (Add script entry, Add Key...): UNVERIFIED whether it flushes before the parent OK -- R2 left this open; the first crossing moves the transaction to commit-attempted, which is the conservative reading"

[actions.ok_folder_redirect_dialog]
class = "commit_point"
notes = "R3 confirms the Folder Redirection property flow writes the certified fdeploy marker/payload; the compatibility-warning boundary remains conservatively within the same armed invocation"

[actions.ok_security_entry_dialog]
class = "potentially_mutating"
notes = "R4 confirms the end-to-end GptTmpl.inf effect; exact per-entry dialog durability remains unisolated and therefore potentially_mutating"

[actions.ok_policy_setting_dialog]
class = "potentially_mutating"
notes = "R5 confirms the end-to-end Registry.pol effect; exact per-setting dialog durability remains unisolated and therefore potentially_mutating"

[actions.close_editor_window]
class = "commit_point"
notes = "closing the GPME editor window flushes pending snap-in state; declared as the last-resort commit point for capabilities whose per-dialog OKs stay potentially_mutating"

[actions.commit_migration_table_save]
class = "commit_point"
notes = "the GPMC COM Save call behind the R1 setup-only transaction (GPMgmt.GPM MigrationTable.Save writes the .migtable file); programmatic surface, declared so the zero-GUI transaction still crosses a classified boundary"

# Actions added 2026-09-15 for the WMI-filters capability (window-7 prep;
# first GPMC-main-console flow -- every prior gesture ran inside GPME). All
# unqualified: no estate run has observed these dialogs yet, so the classes
# are the conservative readings and the window iterates on measured deltas.

[actions.open_gpmc_console]
class = "orientation_only"
notes = "launches/attaches the GPMC main console window (pre-elevated at the setup boundary); no gesture has touched a GPMC-main-console node before this capability"

[actions.open_new_wmi_filter_dialog]
class = "reversible_pre_commit"
notes = "Action-menu New on the WMI Filters node: opens the New WMI Filter dialog; cancel before any child/parent OK undoes it (unmeasured dialog)"

[actions.add_wmi_query]
class = "reversible_pre_commit"
notes = "Add button inside the New WMI Filter dialog: opens the WMI Query child dialog; cancel undoes (unmeasured dialog)"

[actions.ok_wmi_query_dialog]
class = "potentially_mutating"
notes = "OK inside the WMI Query child dialog: unverified whether GPMC flushes the query to AD before the parent OK -- the first mutating boundary by the conservative reading, mirroring ok_child_dialog"

[actions.ok_new_wmi_filter_dialog]
class = "commit_point"
notes = "Save on the New WMI Filter dialog (MEASURED window 7 run 6: the dialog's commit button is 'Save', not 'OK'; buttons are Add/Remove/Edit + Save/Cancel): writes the msWMI-Som object to AD directly with no parent dialog -- the commit boundary the window correlates with the certified AD representation"

# Selectors added with the same action rows. Name-based criteria bind UI
# language strongly (contract section 6); automation_ids replace these as
# the captures observe them.

# Selectors used by the shipped R2-R5 flows are estate-observed in their banked
# UI journals. Name/title selectors still lack automation IDs and therefore
# remain strongly language/version bound; new selectors start unverified.

[selectors.startup_scripts_dialog]
# Estate-observed display title; expect localisation dependency.
title_regex = "Startup Properties"

[selectors.scripts_tab]
# Estate-observed display name; automation_id remains unavailable.
name = "Scripts"

[selectors.add_button]
name = "Add..."

[selectors.script_name_field]
# Estate-observed label selector; automation_id remains unavailable.
name_regex = "Script Name"

[selectors.script_parameters_field]
name_regex = "Script Parameters"

[selectors.ps_order_dropdown]
name_regex = "following order"

# Selectors for R3/R4/R5 dialog families, observed in the corresponding banked
# captures; portability outside the qualified estate remains dependency-bound.
[selectors.property_sheet_dialog]
title_regex = "Properties"

[selectors.security_entry_dialog]
title_regex = "Template Security Policy"

# Selectors for the WMI-filters flow (window-7 prep, unobserved until the
# first run): titles/names follow Microsoft documentation conventions, not
# estate capture, and are expected to be corrected by the qualification run.
[selectors.gpmc_console_window]
title_regex = "Group Policy Management"

[selectors.wmi_filters_node]
name_regex = "^WMI Filters$"

[selectors.action_menu_new_item]
name_regex = "^New"

[selectors.new_wmi_filter_dialog]
title_regex = "^New WMI Filter"

[selectors.wmi_query_dialog]
title_regex = "WMI Query"

# Selector dependencies: what the compatibility predicate checks, per rung.
# Title/name selectors bind UI language strongly. Once the spike observes
# automation_ids, those selectors become binary_version-bound (strong) and the
# language binding weakens. No coordinate selectors are declared; DPI would
# bind only if any are added.

[[selector_dependencies]]
selector = "startup_scripts_dialog"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "scripts_tab"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "add_button"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "script_name_field"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "script_parameters_field"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "ps_order_dropdown"
dependency = "ui_language"
strength = "strong"

# Whole-surface fingerprint dependencies ride on the dialog set, not one
# selector: the property sheet and child dialogs are fingerprinted together
# at qualification time.
[[selector_dependencies]]
selector = "startup_scripts_dialog"
dependency = "dialog_fingerprint"
strength = "strong"

[[selector_dependencies]]
selector = "startup_scripts_dialog"
dependency = "binary_version"
strength = "strong"

[[selector_dependencies]]
selector = "startup_scripts_dialog"
dependency = "os_build"
strength = "provenance"

# The new dialog family (property sheets + policy dialogs share one window
# class with the Scripts sheet): fingerprinted together at qualification.
[[selector_dependencies]]
selector = "property_sheet_dialog"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "property_sheet_dialog"
dependency = "dialog_fingerprint"
strength = "strong"

[[selector_dependencies]]
selector = "security_entry_dialog"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "security_entry_dialog"
dependency = "dialog_fingerprint"
strength = "strong"

# WMI-filters flow dependencies (window-7 prep, unqualified until banked).
[[selector_dependencies]]
selector = "gpmc_console_window"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "wmi_filters_node"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "action_menu_new_item"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "new_wmi_filter_dialog"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "new_wmi_filter_dialog"
dependency = "dialog_fingerprint"
strength = "strong"

[[selector_dependencies]]
selector = "wmi_query_dialog"
dependency = "ui_language"
strength = "strong"

[[selector_dependencies]]
selector = "wmi_query_dialog"
dependency = "dialog_fingerprint"
strength = "strong"

# WI-L5: the one runtime-enforced selector dependency. The prepared-context
# uia_digest below is the qualified baseline for this surface's pre-gesture
# desktop; the executor refuses before setup when the live digest differs.
# Banked from measured evidence: the SAME digest appears in the context steps
# of every banked record across estate windows 2-7 (2026-09-03 through
# 2026-09-15, thirteen records, checkpoint reverts between them), so the
# digest is stable across runs and reverts on this build family.
[[surface_fingerprints]]
selector = "prepared_context"
uia_digest = "9193a3dfa818177116222e6726568faf1e459eb031086f91eface84216a650ea"
banked_from = "docs/estate-window-7/records/w7-record.json"

# Dialog-level fingerprints (new_wmi_filter_dialog, property_sheet_dialog, ...)
# are deliberately NOT banked yet: no qualification window has captured their
# digests as standalone facts. They stay declared-only until measured.
