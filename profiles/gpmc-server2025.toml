## Known commit-boundary facts (from the manual evidence regime)

These are initial facts from human-run captures, to be validated by the
driver-development spike:

- Startup/Shutdown Scripts dialog: writes `scripts.ini` under
  `Machine\Scripts\` when the dialog closes with OK. `# UNVERIFIED`
- Scripts dialog PowerShell tab: the "For this GPO, run scripts in the
  following order" dropdown writes `psscripts.ini` state. `# UNVERIFIED`
- whether OK on a child script-entry dialog is itself a commit point:
  `# UNVERIFIED`
- Folder Redirection Properties: warns on unreachable UNC, writes at OK.
  `# UNVERIFIED` (R3 scope)
- Registry/File Security dialogs: three mutually exclusive propagation radio
  options; code mapping is the R4 question. `# UNVERIFIED` (R4 scope)

## Action classifications (v0 sketch)

| Action | Class | Notes |
|---|---|---|
| open_gpo_editor | orientation_only | launches/attaches editor window |
| navigate_tree | orientation_only | scope-pane navigation |
| open_startup_scripts_dialog | orientation_only | opens property sheet |
| add_script_entry | reversible_pre_commit | child dialog; cancel undoes |
| set_ps_order | reversible_pre_commit | dropdown selection |
| ok_startup_scripts_dialog | commit_point | presumed scripts.ini flush |
| cancel_dialog | reversible_pre_commit | closes without commit |

