# WI-L5: the one runtime-enforced selector dependency is the banked
# prepared-context uia_digest. The qualification window measured it (the
# prepare-phase context capture in the banked record), and the row below
# banks that digest, so the gate is ON for every later run on this surface:
# a mismatch refuses before setup. Dialog-level fingerprints remain
# deliberately unbanked until a window captures them.

[[surface_fingerprints]]
selector = "prepared_context"
uia_digest = "9193a3dfa818177116222e6726568faf1e459eb031086f91eface84216a650ea"
banked_from = "docs/estate-window-11/records/w11-r2-record.json"
